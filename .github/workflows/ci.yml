name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: Setup Melos
      run: dart pub global activate melos
    
    - name: Install dependencies
      run: melos bootstrap
    
    - name: Verify formatting
      run: melos format:check
    
    - name: Analyze project source
      run: melos analyze
    
    - name: Run tests
      run: melos test
    
    - name: Run golden tests
      run: melos golden:verify
    
    - name: Run accessibility tests
      run: melos accessibility:test
    
    - name: Run performance tests
      run: melos performance:test
    
    - name: Check dependency constraints
      run: melos deps:check
    
    - name: Check public API stability
      run: melos api:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: Setup Melos
      run: dart pub global activate melos
    
    - name: Install dependencies
      run: melos bootstrap
    
    - name: Build packages
      run: melos build:all

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: Setup Melos
      run: dart pub global activate melos
    
    - name: Install dependencies
      run: melos bootstrap
    
    - name: Run integration tests
      run: melos integration:test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
    
    - name: Setup Melos
      run: dart pub global activate melos
    
    - name: Install dependencies
      run: melos bootstrap
    
    - name: Run security audit
      run: flutter pub audit
    
    - name: Check for vulnerabilities
      run: |
        find . -name "pubspec.yaml" -exec flutter pub deps --json {} \; | \
        jq -r '.packages[] | select(.kind == "direct") | .name' | \
        while read package; do
          echo "Checking $package for vulnerabilities..."
          flutter pub deps --json | jq -r ".packages[] | select(.name == \"$package\") | .version"
        done