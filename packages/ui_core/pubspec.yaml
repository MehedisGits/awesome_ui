name: ui_core
description: Core platform adapters and utilities for the Awesome UI component library
version: 1.0.0
homepage: https://github.com/rakibulislammehedi/awesome_ui

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ui_tokens:
    path: ../ui_tokens
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

topics:
  - design-system
  - platform-adapters
  - accessibility
  - responsive
